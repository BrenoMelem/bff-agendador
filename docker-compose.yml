version: "3.8"

services:
  agendador-tarefas:
    build: ../../agendador-tarefas/agendador-tarefas
    container_name: agendador-tarefas
    ports:
      - "8081:8081"
    environment:
      - DB_URL=${AGENDADOR_DB_URL}
      - DB_NOME=${AGENDADOR_DB_NOME}
      - DB_USUARIO_URL=${AGENDADOR_USUARIO_URL}
    depends_on:
      - mongo

  bff-agendador-tarefas:
    build: .
    container_name: bff-agendador-tarefas
    ports:
      - "8083:8083"
    environment:
      - USER_URL=${BFF_USUARIO_URL}
      - AGENDADOR_URL=${BFF_AGENDADOR_URL}
      - NOTIFICACAO_URL=${BFF_NOTIFICACAO_URL}
      - USER_PASSWORD=${BFF_USER_PASSWORD}
      - USER_MAIL=${BFF_USER_MAIL}
      - CRON_HOUR=${BFF_CRON_HOUR}
    depends_on:
      - agendador-tarefas
      - usuario
      - notificacao

  usuario:
    build: ../../usuario/usuario
    container_name: usuario
    ports:
      - "8080:8080"
    environment:
      - DB_URL=${USUARIO_DB_URL}
      - DB_USERNAME=${USUARIO_DB_USERNAME}
      - DB_PASSWORD=${USUARIO_DB_PASSWORD}
    depends_on:
      - postgres

  notificacao:
    build: ../../notificacao/notificacao
    container_name: notificacao
    ports:
      - "8082:8082"
    environment:
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

  postgres:
    image: postgres:latest
    container_name: postgres
    restart: no
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  mongo:
    image: mongo:latest
    container_name: mongo
    restart: no
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: ${AGENDADOR_DB_NOME}

networks:
  default:
    driver: bridge